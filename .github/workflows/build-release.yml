name: build-release

on:
  push:
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git iproute2 nftables ninja-build pkg-config libncurses-dev libssl-dev
      - name: Build pinned liboqs
        run: |
          git clone --no-checkout https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          git -C /tmp/liboqs fetch --depth=1 origin 97f6b86b1b6d109cfd43cf276ae39c2e776aed80
          git -C /tmp/liboqs checkout --detach 97f6b86b1b6d109cfd43cf276ae39c2e776aed80
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_DIST_BUILD=ON
          cmake --build /tmp/liboqs/build --parallel 2
          sudo cmake --install /tmp/liboqs/build
          sudo ldconfig
          pkg-config --exists liboqs
      - name: Install Python test tools
        run: python3 -m pip install pytest bandit
      - name: Native tests and static analysis (liboqs required)
        run: make check-ci
      - name: Python tests
        run: python3 -m pytest -q
      - name: nftables namespace integration
        run: sudo env MK1_RUN_NETNS_TESTS=1 python3 -m pytest -q tests/integration/test_firewall_netns.py
      - name: Clang static analyzer
        run: clang --version
      - name: Bandit (medium and above)
        run: bandit -q -r airgap_ai_defender.py mk1_usb_guard.py mk1_remote_dashboard.py mk1_secure_transport.py mk1_memory_guard.py mk1_map.py --severity-level medium
