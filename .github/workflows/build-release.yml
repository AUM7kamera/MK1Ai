```yaml
name: Build and sign release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-models:
    runs-on: ubuntu-latest
    container:
      image: ocaml/opam:debian-12-ocaml-5.3@sha256:bbaac53e502f6602013d8967c3a54cfcb898b556f453ab72e8e23966c3c681df
      options: --user 0
      env:
        OPAMROOT: /home/opam/.opam
        OPAMROOTISOK: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ProVerif system dependencies
        run: |
          apt-get update
          apt-get install -y libexpat1-dev libgtk2.0-dev pkg-config

      - name: Install pinned ProVerif
        run: opam install -y --assume-depexts proverif.2.05

      - name: Verify symbolic models
        run: opam exec -- sh formal/check-proverif.sh

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git iproute2 nftables ninja-build pkg-config libncurses-dev libssl-dev

      - name: Build pinned liboqs
        run: |
          git clone --no-checkout https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          git -C /tmp/liboqs fetch --depth=1 origin 97f6b86b1b6d109cfd43cf276ae39c2e776aed80
          git -C /tmp/liboqs checkout --detach 97f6b86b1b6d109cfd43cf276ae39c2e776aed80
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_DIST_BUILD=ON
          cmake --build /tmp/liboqs/build --parallel 2
          sudo cmake --install /tmp/liboqs/build
          sudo ldconfig
          pkg-config --exists liboqs

      - name: Install Python test tools
        run: |
          python3 -m pip install -r requirements-key-management.txt -r requirements-remote.txt -r requirements-secure-transport.txt
          python3 -m pip install pytest bandit

      - name: Native tests and static analysis (liboqs required)
        run: make check-ci

      - name: Python tests
        run: python3 -m pytest -q

      - name: nftables namespace integration
        run: |
          sudo env MK1_RUN_NETNS_TESTS=1 \
            PYTHONUSERBASE="$(python3 -m site --user-base)" \
            python3 -m pytest -q tests/integration/test_firewall_netns.py

      - name: Clang static analyzer
        run: clang --version

      - name: Bandit (medium and above)
        run: |
          bandit -q -r \
            airgap_ai_defender.py \
            mk1_usb_guard.py \
            mk1_remote_dashboard.py \
            mk1_secure_transport.py \
            mk1_memory_guard.py \
            mk1_map.py \
            mk1_key_derivation.py \
            mk1_key_backup.py \
            mk1_hybrid_kem.py \
            mk1_session_ratchet.py \
            mk1_key_registry.py \
            mk1_quorum.py \
            mk1_quorum_cli.py \
            mk1_external_verifier.py \
            mk1_external_verifier_cli.py \
            --severity-level medium

  nft-legacy-netns:
    name: nftables netns (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:22.04

    container:
      image: ${{ matrix.image }}
      options: --privileged

    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git iproute2 nftables python3 python3-pip python3-venv

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: nft version
        run: nft --version

      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install \
            -r requirements-key-management.txt \
            -r requirements-remote.txt \
            -r requirements-secure-transport.txt \
            pytest

      - name: Unit tests for nft rendering
        run: /tmp/venv/bin/python -m pytest -q tests/test_firewall_nft.py

      - name: netns integration (applies real rules)
        run: |
          MK1_RUN_NETNS_TESTS=1 \
            /tmp/venv/bin/python -m pytest -q tests/integration/test_firewall_netns.py

  build-sign:
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'push' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/')
      )

    runs-on: ubuntu-24.04
    environment: release-signing

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libncurses-dev libssl-dev pkg-config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install release-only builder
        run: python -m pip install "Cython==3.0.12" "setuptools==78.1.1"

      - name: Build and sign bundle
        env:
          MK1AI_ED25519_PRIVATE_KEY: ${{ secrets.MK1AI_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$MK1AI_ED25519_PRIVATE_KEY" ]]; then
            echo "::error::Configure the protected MK1AI_ED25519_PRIVATE_KEY repository secret."
            exit 1
          fi

          key_file="$RUNNER_TEMP/mk1ai-release-ed25519.pem"
          public_key="$RUNNER_TEMP/mk1ai-release-ed25519.pub"

          umask 077
          printf '%s\n' "$MK1AI_ED25519_PRIVATE_KEY" > "$key_file"
          trap 'rm -f -- "$key_file"' EXIT

          openssl pkey -in "$key_file" -passin pass: -check -noout
          openssl pkey -in "$key_file" -pubout -out "$public_key"

          bash scripts/build_release.sh "$key_file"

          python scripts/verify_release.py \
            --bundle dist/mk1ai-release \
            --public-key "$public_key"

          cp -- "$public_key" dist/mk1ai-release/release-signing.pub
          tar -C dist -czf dist/mk1ai-release.tar.gz mk1ai-release

      - uses: actions/upload-artifact@v4
        with:
          name: mk1ai-release-${{ github.ref_name }}
          path: dist/mk1ai-release.tar.gz
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-sign
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mk1ai-release-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/mk1ai-release.tar.gz \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/mk1ai-release.tar.gz \
              --verify-tag \
              --generate-notes
          fi
```