# Release packaging workflow. Contact: 山田 悠 (Yu Yamada).
name: Build and sign release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libncurses-dev libssl-dev
          python3 -m pip install -r requirements-secure-transport.txt -r requirements-remote.txt bandit
      - name: Clang static analyzer
        run: make analyze
      - name: Bandit
        run: bandit -q -r airgap_ai_defender.py mk1_usb_guard.py mk1_remote_dashboard.py mk1_secure_transport.py mk1_memory_guard.py mk1_map.py --severity-level high
  build-sign:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libncurses-dev libssl-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release-only builder
        run: python -m pip install "Cython==3.0.12" "setuptools==78.1.1"
      - name: Build and sign bundle
        env:
          MK1AI_ED25519_PRIVATE_KEY: ${{ secrets.MK1AI_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$MK1AI_ED25519_PRIVATE_KEY" ]]; then
            echo "::error::Configure the protected MK1AI_ED25519_PRIVATE_KEY repository secret."
            exit 1
          fi
          key_file="$RUNNER_TEMP/mk1ai-release-ed25519.pem"
          public_key="$RUNNER_TEMP/mk1ai-release-ed25519.pub"
          umask 077
          printf '%s\n' "$MK1AI_ED25519_PRIVATE_KEY" > "$key_file"
          trap 'rm -f -- "$key_file"' EXIT
          openssl pkey -in "$key_file" -passin pass: -check -noout
          openssl pkey -in "$key_file" -pubout -out "$public_key"
          bash scripts/build_release.sh "$key_file"
          python scripts/verify_release.py --bundle dist/mk1ai-release --public-key "$public_key"
          cp -- "$public_key" dist/mk1ai-release/release-signing.pub
          tar -C dist -czf dist/mk1ai-release.tar.gz mk1ai-release
      - uses: actions/upload-artifact@v4
        with:
          name: mk1ai-release-${{ github.ref_name }}
          path: dist/mk1ai-release.tar.gz
          if-no-files-found: error
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mk1ai-release-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/mk1ai-release.tar.gz --clobber
          else
            gh release create "$TAG_NAME" dist/mk1ai-release.tar.gz \
              --verify-tag --generate-notes
          fi
